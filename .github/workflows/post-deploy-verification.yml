name: ERP Post Deploy Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-smoke
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify deployment relevance
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "$CHANGED"

          RUNTIME_CHANGED=false
          while IFS= read -r FILE; do
            case "$FILE" in
              gateway.js|server.js|read-diagnostics-preload.js|edit-diagnostics-preload.js|deployment-diagnostics-preload.js|package.json|proposal-rules.json|billing-rules.json|openapi-actions.json)
                RUNTIME_CHANGED=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "runtime_changed=$RUNTIME_CHANGED" >> "$GITHUB_OUTPUT"

  static-qa:
    needs: classify-changes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run static QA
        run: npm run qa

  smoke-config-preflight:
    if: ${{ needs.classify-changes.outputs.runtime_changed == 'true' }}
    needs: [classify-changes, static-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Validate smoke configuration
        env:
          CONNECTOR_API_KEY: ${{ secrets.CONNECTOR_API_KEY }}
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_PROPOSAL_NUMBER: ${{ vars.SMOKE_PROPOSAL_NUMBER }}
        shell: bash
        run: |
          FAILED=false
          if [ -z "$CONNECTOR_API_KEY" ]; then
            echo "::error::CONNECTOR_API_KEY nao esta disponivel como Actions secret neste workflow."
            FAILED=true
          fi
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "::error::SMOKE_BASE_URL nao esta configurada como Actions variable."
            FAILED=true
          fi
          if [ -z "$SMOKE_PROPOSAL_NUMBER" ]; then
            echo "::error::SMOKE_PROPOSAL_NUMBER nao esta configurado como Actions variable."
            FAILED=true
          fi
          if [ "$FAILED" = true ]; then
            exit 1
          fi
          echo "Configuracao de smoke disponivel. Nenhum valor secreto foi exibido."

  production-verification:
    if: ${{ needs.classify-changes.outputs.runtime_changed == 'true' }}
    needs: [classify-changes, static-qa, smoke-config-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for exact deployment and run read-only smoke tests
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_PROPOSAL_NUMBER: ${{ vars.SMOKE_PROPOSAL_NUMBER }}
          CONNECTOR_API_KEY: ${{ secrets.CONNECTOR_API_KEY }}
          EXPECTED_DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_WAIT_SECONDS: '600'
          DEPLOY_POLL_SECONDS: '15'
          SMOKE_HUBSPOT: 'true'
        run: npm run qa:smoke

  non-runtime-verification:
    if: ${{ needs.classify-changes.outputs.runtime_changed != 'true' }}
    needs: [classify-changes, static-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Record non-runtime change
        run: |
          echo "Mudanca sem impacto de runtime. QA estatico concluido; deploy de producao e smoke por commit nao sao exigidos."

  technical-manager-failure:
    if: ${{ always() && (needs.static-qa.result == 'failure' || needs.smoke-config-preflight.result == 'failure' || needs.production-verification.result == 'failure') }}
    needs: [classify-changes, static-qa, smoke-config-preflight, production-verification, non-runtime-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Open or preserve Technical Manager incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATIC_RESULT: ${{ needs.static-qa.result }}
          CONFIG_RESULT: ${{ needs.smoke-config-preflight.result }}
          SMOKE_RESULT: ${{ needs.production-verification.result }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          TITLE="ERP Technical Manager: verification failed ${SHORT_SHA}"
          EXISTING=$(gh issue list --repo "$REPOSITORY" --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Incident issue already exists: #$EXISTING"
            exit 0
          fi
          cat > /tmp/incident.md <<EOF
          ## Falha automatica de validacao

          Commit: \`$SHA\`
          Static QA: **$STATIC_RESULT**
          Smoke config preflight: **$CONFIG_RESULT**
          Post-deploy smoke: **$SMOKE_RESULT**
          Workflow: $RUN_URL

          O Gerente Tecnico nao deve considerar esta entrega concluida enquanto a causa nao for classificada e a validacao nao passar.

          Classificar como uma das categorias:
          - codigo;
          - configuracao/secrets;
          - deploy/infraestrutura;
          - integracao externa.

          Se o preflight de configuracao falhar, corrigir secrets/variables antes de repetir o smoke. Nenhuma gravacao comercial deve ser usada para diagnostico.
          EOF
          gh issue create --repo "$REPOSITORY" --title "$TITLE" --body-file /tmp/incident.md
