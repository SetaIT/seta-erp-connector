name: Proposal Service v2 QA

on:
  push:
    branches:
      - v2/proposal-service
    paths:
      - 'proposal-service-v2/**'
      - '.github/workflows/v2-qa.yml'
  pull_request:
    paths:
      - 'proposal-service-v2/**'
      - '.github/workflows/v2-qa.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proposal-service-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: npm test
