services:
  - type: web
    name: seta-erp-connector
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BETEL_BASE_URL
        value: https://api.beteltecnologia.com/api
      - key: BETEL_ACCESS_TOKEN
        sync: false
      - key: BETEL_SECRET_ACCESS_TOKEN
        sync: false
      - key: CONNECTOR_API_KEY
        sync: false
