name: V1 Connector Stabilization

on:
  push:
    branches:
      - stabilization/v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v1-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Run connector QA
        run: npm run qa
