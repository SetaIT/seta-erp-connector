openapi: 3.0.3
info:
  title: Seta Telecom ERP Connector
  version: 1.0.2
  description: Conector seguro entre ChatGPT Actions e a API Betel Tecnologia.
servers:
  - url: https://seta-erp-connector-production-1255.up.railway.app
paths:
  /erp/clientes:
    get:
      operationId: buscarClientes
      summary: Busca clientes no ERP
      parameters:
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: nome
          schema:
            type: string
        - in: query
          name: cnpj
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
      responses:
        '200':
          description: Resultado da busca de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListResponse'
    post:
      operationId: criarCliente
      summary: Cria um cliente no ERP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiObjectResponse'
  /erp/produtos:
    get:
      operationId: buscarProdutos
      summary: Busca produtos no ERP
      parameters:
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: nome
          schema:
            type: string
        - in: query
          name: codigo_interno
          schema:
            type: string
      responses:
        '200':
          description: Resultado da busca de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListResponse'
  /erp/usuarios:
    get:
      operationId: buscarUsuarios
      summary: Lista ou busca usuarios e vendedores do ERP
      parameters:
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: nome
          schema:
            type: string
      responses:
        '200':
          description: Usuarios do ERP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListResponse'
  /erp/situacoes-orcamentos:
    get:
      operationId: buscarSituacoesOrcamento
      summary: Lista situacoes disponiveis para orcamentos
      responses:
        '200':
          description: Situacoes de orcamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListResponse'
  /erp/orcamentos:
    get:
      operationId: buscarOrcamentos
      summary: Busca orcamentos existentes
      parameters:
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: codigo
          schema:
            type: string
        - in: query
          name: cliente_id
          schema:
            type: string
      responses:
        '200':
          description: Orcamentos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListResponse'
    post:
      operationId: criarOrcamento
      summary: Cria um orcamento ou proposta no ERP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrcamentoInput'
      responses:
        '200':
          description: Orcamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiObjectResponse'
  /erp/orcamentos/{id}:
    get:
      operationId: consultarOrcamento
      summary: Consulta um orcamento pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Orcamento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiObjectResponse'
components:
  schemas:
    GenericItem:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        codigo:
          type: string
        status:
          type: string
    ApiListResponse:
      type: object
      properties:
        code:
          type: integer
        status:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/GenericItem'
    ApiObjectResponse:
      type: object
      properties:
        code:
          type: integer
        status:
          type: string
        data:
          $ref: '#/components/schemas/GenericItem'
    ClienteInput:
      type: object
      properties:
        nome:
          type: string
        razao_social:
          type: string
        cpf_cnpj:
          type: string
        email:
          type: string
        telefone:
          type: string
        vendedor_id:
          type: string
    ProdutoOrcamento:
      type: object
      properties:
        id:
          type: string
        nome_produto:
          type: string
        variacao_id:
          type: string
        detalhes:
          type: string
        quantidade:
          type: string
        tipo_valor_id:
          type: string
        nome_tipo_valor:
          type: string
        valor_venda:
          type: string
        tipo_desconto:
          type: string
        desconto_valor:
          type: string
        desconto_porcentagem:
          type: string
    ProdutoWrapper:
      type: object
      properties:
        produto:
          $ref: '#/components/schemas/ProdutoOrcamento'
    OrcamentoInput:
      type: object
      required:
        - tipo
        - codigo
        - cliente_id
        - data
        - situacao_id
      properties:
        tipo:
          type: string
        codigo:
          type: string
        cliente_id:
          type: string
        vendedor_id:
          type: string
        nome_vendedor:
          type: string
        data:
          type: string
        situacao_id:
          type: string
        nome_situacao:
          type: string
        valor_total:
          type: number
        validade:
          type: string
        introducao:
          type: string
        observacoes:
          type: string
        observacoes_interna:
          type: string
        valor_frete:
          type: number
        desconto_valor:
          type: string
        desconto_porcentagem:
          type: string
        exibir_pagamento:
          type: string
        produtos:
          type: array
          items:
            $ref: '#/components/schemas/ProdutoWrapper'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
